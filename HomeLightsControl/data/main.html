<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Helvetica, Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background-color: #f2f2f2;
    }

    table {
      margin: auto;
      border-collapse: collapse;
    }

    th {
      font-size: 36px;
      padding: 10px;
    }

    td {
      font-size: 36px;
      padding: 10px;
    }

    .button {
      width: 90px;
      height: 60px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #555;
      color: white;
    }

    .button.all {
      font-size: 36px;
      background-color: #f2f2f2;
      color: black;
    }

    .button:active {
      opacity: 0.7;
    }

    .icon {
      width: 60px;
    }
  </style>

  <script>
    function sendCmd(cmd) {
      fetch('/' + cmd, {
        method: 'POST'
      });
    }
  </script>
</head>

<body>
  <table>
    <tr>
      <th><button class="button all" onclick="sendCmd('all_on')">ON</button></th>
      <th></th>
      <th><button class="button all" onclick="sendCmd('all_off')">OFF</button></th>
    </tr>

    <tr>
      <td><button class="button" onclick="sendCmd('0_on')"></button></td>
      <td class="icon">🛏️</td>
      <td><button class="button" onclick="sendCmd('0_off')"></button></td>
    </tr>

    <tr>
      <td><button class="button" onclick="sendCmd('1_on')"></button></td>
      <td class="icon">❓</td>
      <td><button class="button" onclick="sendCmd('1_off')"></button></td>
    </tr>

    <tr>
      <td><button class="button" onclick="sendCmd('2_on')"></button></td>
      <td class="icon">🏠</td>
      <td><button class="button" onclick="sendCmd('2_off')"></button></td>
    </tr>

    <tr>
      <td><button class="button" onclick="sendCmd('3_on')"></button></td>
      <td class="icon">🎅</td>
      <td><button class="button" onclick="sendCmd('3_off')"></button></td>
    </tr>

    <tr>
      <td><button class="button" onclick="sendCmd('4_on')"></button></td>
      <td class="icon">🎄</td>
      <td><button class="button" onclick="sendCmd('4_off')"></button></td>
    </tr>
  </table>

</body>
</html>
